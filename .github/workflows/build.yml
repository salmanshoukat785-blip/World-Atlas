name: Build APK from ZIP

# Repo me sirf ZIP file (e.g. gk-quiz-app.zip) aur ye file rakhni hai.
# Workflow zip ko khud unzip karega aur APK banayega.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: repo me koi .zip file nahi mili"
            exit 1
          fi
          echo "Using zip: $ZIP"
          mkdir -p "$RUNNER_TEMP/proj"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/proj"
          SETTINGS=$(find "$RUNNER_TEMP/proj" -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: zip me settings.gradle.kts nahi mili"
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GK-Quiz-APK
          path: ${{ env.PROJECT_ROOT }}/app/build/outputs/apk/debug/app-debug.apk
